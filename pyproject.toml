[project]
name = "cogno-anima"
version = "0.1.0"
description = "Infrastructure-agnostic cognitive pipeline core (NOUMENO/NER/ID/EGO/SUPEREGO + Drift)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vinicius Vale" }]
maintainers = [{ name = "Sudoers AI" }]
keywords = ["llm", "nlp", "cognitive-architecture", "agents", "function-calling", "pii", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "langdetect>=1.0.9",
    # Model transport (LLM/embedding backends, factory, fallback) lives in
    # cogno-synapse; it brings httpx + cogno-homeo transitively.
    #
    # The floor CANNOT yet name what this package needs: the stages import
    # `system_fingerprint_of`/`served_model_of` (who served each call — see
    # `StageMetrics.system_fingerprint`), which are on cogno-synapse main and are NOT in the
    # published 0.1.2. CI installs that lib from git, so it has them; an install resolving to
    # 0.1.2 from an index raises ImportError at import time, which is the intended failure —
    # a reader that silently degrades to `None` forever would make every row say "the provider
    # did not say" about providers that did. Raise this floor to the release that carries them.
    "cogno-synapse>=0.1,<0.2",
]

[project.urls]
Homepage = "https://github.com/sudoers-ai/cogno-anima"
Repository = "https://github.com/sudoers-ai/cogno-anima"
Issues = "https://github.com/sudoers-ai/cogno-anima/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # tests/unit/test_ci_installs_one_chain.py parses .github/workflows/ci.yml. A hard dep,
    # not an importorskip: a guard that skips itself is the silence it exists to end.
    "pyyaml>=6.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    # Per-test cap for the nightly `semantics` shard (PYTEST_TIMEOUT in .github/workflows/ci.yml).
    "pytest-timeout>=2.3",
    "hypothesis>=6.0",
    "ruff>=0.5",
    "mypy>=1.8",
]
# Cloud LLM backends moved to cogno-synapse; this convenience extra pulls them
# all in (install a single provider with e.g. `pip install "cogno-synapse[openai]"`).
llm = ["cogno-synapse[llm]>=0.1,<0.2"]

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cogno_anima*"]

[tool.setuptools.package-data]
# PEP 561. Without this marker INSIDE the built wheel, a type checker that finds this package in
# site-packages does not read a line of it: a consumer with `ignore_missing_imports = true` — which
# every repo in this stack sets, to keep third-party noise out of its own errors — sees the whole
# package silently become `Any`, and every disagreement across the seam stops being an error.
#
# Measured on cogno-host 2026-09-18: with the sibling libs installed as wheels (what its CI does),
# `mypy cogno_host` resolved 13 of the 16 pinned siblings and was blind to exactly the three that
# ship no marker — `cogno-anima`, `cogno-engram`, `cogno-observability`. A deliberately wrong name
# (`from cogno_anima import DEFINITELY_NOT_A_REAL_NAME`) came back GREEN for this package: the host
# was type-checking NOTHING of it. In the observability case that same blindness had been hiding a
# real contract error on the host's `main` for 17 days, through a green "Type-check (mypy)" step.
#
# `package-data` is declared EXPLICITLY rather than left to `include-package-data`: modern
# setuptools discovers the file on its own, but a guarantee that rests on a default moves when the
# default does — and this one is invisible when it breaks, because the repo still LOOKS typed and
# only the install is not. `tests/unit/test_py_typed_ships.py` holds it against a BUILT WHEEL.
#
# The other entry ships the NOUMENO/NER prompt templates inside the wheel.
cogno_anima = ["prompt_templates/**/*.txt", "py.typed"]

[tool.pytest.ini_options]
# The whole suite runs on pytest-asyncio (a declared dev dependency).
# asyncio_mode = "auto" means every `async def test_*` is awaited without a
# per-test marker, keeping the suite consistent and independent of `anyio`
# (which is only present transitively via httpx).
asyncio_mode = "auto"
# A bare `pytest` runs the UNIT suite only. tests/integration defaults to the local
# Ollama, and on a box where that server answers live traffic a bare run queues real
# turns behind the suite. Integration is opt-in BY PATH: `pytest tests/integration`
# (CI already invokes both directories by name, so this changes no CI job).
# tests/unit/test_bare_pytest_collects_no_integration.py holds this line.
testpaths = ["tests/unit"]
# Nightly shards for tests/integration. The workflow selects with `-m`, so the path it
# hands pytest stays `tests/integration` — an ANCESTOR of every file in it — and the
# third shard is the COMPLEMENT of the other two, so an unmarked new file still runs.
# tests/unit/test_ci_runs_every_test_file.py holds that line.
markers = [
    "perception: NOUMENO — the nightly shard for tests/integration/test_noumeno.py",
    "semantics: NER — the nightly shard for tests/integration/test_ner.py",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Default ruleset (pyflakes + core pycodestyle). Kept lean on purpose — the
# CI gate should catch real defects (unused imports, undefined names, syntax),
# not enforce cosmetic style churn.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true   # langdetect/httpx ship partial or no stubs
# Type-check the library only; the prompt-driven parsing has many dynamic
# `data.get(...)` accesses, so we keep this pragmatic rather than strict.
files = ["cogno_anima"]
warn_unused_ignores = true
