name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 5 * * *"       # nightly — the Ollama suite below
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model for the integration suite"
        default: "qwen3:8b"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (pinned dev env + editable package)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # Sibling transport libs from git: cogno-synapse -> cogno-homeo, homeo first.
          # They ARE on PyPI (0.1.2 / 0.1.1) and git main is ahead under the same version
          # numbers, so omitting these does not fail — pip quietly installs the old release
          # and the log cannot tell you. Every job that installs this package needs them
          # (tests/unit/test_ci_installs_one_chain.py holds that line).
          pip install "cogno-homeo @ git+https://github.com/sudoers-ai/cogno-homeo.git"
          pip install "cogno-synapse @ git+https://github.com/sudoers-ai/cogno-synapse.git"
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: ruff check cogno_anima cognobench tests scripts

      - name: Type check (mypy)
        run: mypy

      - name: Unit tests (with coverage gate)
        # Integration tests need a live Ollama and are skipped in CI.
        run: pytest tests/unit -q --cov=cogno_anima --cov-report=term-missing --cov-fail-under=85

  # ── the 97 integration tests, and the six FILES of them that ran nowhere ───────────────
  #
  # They gate on a live Ollama and the `test` job has none, so they skipped silently in CI and
  # only ever ran when someone remembered to do it by hand. On 2026-08-03 that cost a real
  # defect: `context_used` was set to True on a FIRST turn because the model invented a
  # `context_turn` with no history to reference. The test that catches it
  # (`test_noumeno_context_used_consistency`) already existed, had been merged, and had never
  # executed anywhere automated.
  #
  # NOT a PR gate, on purpose. These assert on the behaviour of a real model, so a merge gate
  # here would make "main is always green" depend on sampling rather than on the code. Nightly
  # + manual gives the signal without turning a red main into noise — the same shape as
  # cogno-host's `ollama-e2e` canary.
  #
  # A CANARY, not the whole suite. The first version ran all 96 tests on
  # `mistral:latest` and was measured, not assumed: 56 passed, **30 failed on httpx.ReadTimeout**
  # and it took 2h03. A free runner is 2 CPU cores with no GPU, and a 7B model simply does not
  # answer inside the client timeout there. A nightly that is permanently red is worse than no
  # nightly — it teaches everyone to ignore it, which is precisely how the defects this job
  # exists to catch stayed hidden.
  #
  # The model matches what the deployment actually runs (`qwen3:8b`), so this exercises the real
  # configuration rather than a stand-in — worth more than a faster green. It is also BIGGER than
  # the mistral that timed out; `model:` on a manual dispatch takes a smaller one if the runner
  # cannot keep up.
  #
  # That narrowing was RIGHT about the cost and WRONG about the scope. It cut the canary to one
  # FILE, and the other six files of `tests/integration` — 56 node ids, including the five that
  # pin the SUPEREGO judge fail-CLOSED and the two that run a whole turn through every seam —
  # were then invoked by nothing at all. Merged, reviewed, never executed anywhere automated:
  # the exact state this job was created to end, recreated one level down.
  #
  # SHARDED, and sharded so that no invocation names a FILE. Each shard runs the DIRECTORY
  # `tests/integration` and selects with `-m`, so the path handed to pytest stays an ANCESTOR of
  # every file in it. The third shard is the literal COMPLEMENT of the other two
  # (`not perception and not semantics`), so a new integration file with no marker lands in it
  # and RUNS — nothing can fall out the way those six did.
  # `tests/unit/test_ci_runs_every_test_file.py` is the rule that holds this line; it is the
  # reason the six were found, and it fails the day a shard starts naming files again.
  #
  # The split criterion is TIME, from the one measurement available: nightly run 33494160177
  # (2026-09-01) ran `test_noumeno.py` — 41 node ids — in 17m49s on this runner with qwen3:8b,
  # plus 78s of Ollama install + model pull. Budget: no shard over ~30 min. The unit of cost is
  # the LLM GENERATION, not the node id, and the two differ wildly here: `test_ner.py` caches by
  # INPUT (~37 distinct x 2 generations ≈ 74) so its 40 ids cost MORE than noumeno's 41, while
  # `test_id.py` runs a heuristic stage and generates NOTHING. Hence perception (41 ids,
  # 17m49s MEASURED) | semantics (40 ids, ~30 min PROJECTED) | the rest (16 ids, ~40 generations,
  # ~16 min PROJECTED). The two projections are projections; the first run of this job is the
  # measurement, and if `semantics` overruns it splits again — the shard names are a knob, the
  # path is not.
  #
  # `fail-fast: false` because three shards that cancel each other report one failure and hide
  # the other two.
  #
  # `COGNO_TEST_MODEL` is now real (the suite reads it, defaulting to mistral so local runs are
  # unchanged) — the first draft passed a model through an env var that nothing read, so every
  # test would have asked Ollama for something never pulled: green, and testing nothing.
  #
  # The two `llama3` sites are monkeypatched at the httpx layer and never reach Ollama, so
  # nothing pulls that 4.7 GB.
  ollama-integration:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: perception          # tests/integration/test_noumeno.py — 41 ids, 17m49s measured
            select: "perception"
          - shard: semantics           # tests/integration/test_ner.py — 40 ids, ~74 generations
            select: "semantics"
          - shard: downstream          # ID / EGO / SUPEREGO / e2e / composite — 16 ids
            select: "not perception and not semantics"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ollama + pull the models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags && break || sleep 1; done
          ollama pull "${{ github.event.inputs.model || 'qwen3:8b' }}"
          ollama pull nomic-embed-text:latest
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The SAME git chain the `test` job installs. A bare `pip install -e .` resolves the
          # siblings from PyPI, where the published versions sit behind git main under the
          # same numbers — so this job would test the code against releases the unit job never
          # touched. cogno-soma spent four nightlies red on exactly that (soma #27), on a
          # metakey its own main had; here it happens to still pass, which is worse, because
          # nothing says when it stops.
          pip install "cogno-homeo @ git+https://github.com/sudoers-ai/cogno-homeo.git"
          pip install "cogno-synapse @ git+https://github.com/sudoers-ai/cogno-synapse.git"
          pip install -e ".[dev]"
      - name: Canary (${{ matrix.shard }}) — the contract tests, against a real model
        env:
          COGNO_TEST_MODEL: "${{ github.event.inputs.model || 'qwen3:8b' }}"
          COGNO_NER_MODEL: "${{ github.event.inputs.model || 'qwen3:8b' }}"
          # This runner has no GPU. cogno-synapse defaults to a 120 s per-call timeout,
          # which is right for a GPU box and short for ONE generation on an 8B model here:
          # the 2026-08-04 nightly died on httpx.ReadTimeout with 40 of 41 tests PASSING.
          # Nothing was wrong but the clock. Needs cogno-synapse >= 0.1.2.
          COGNO_OLLAMA_TIMEOUT: "600"
        # The path is the DIRECTORY and the selection is a marker: `tests/integration` is an
        # ancestor of every file in it, so a file added tomorrow is collected by one of these
        # three shards without anybody editing this workflow. Answer-quality assertions live in
        # cognobench, which is run deliberately and not on a CPU runner.
        #
        # The assert first: COGNO_OLLAMA_TIMEOUT only does anything on cogno-synapse >= 0.1.2,
        # and pip resolving an older one would silently restore the 120 s timeout and turn this
        # job red again for a reason the log would not name. Fail on the cause, not the symptom.
        run: |
          python - <<'EOF'
          import os
          from cogno_synapse import OllamaBackend
          want = int(os.environ["COGNO_OLLAMA_TIMEOUT"])
          got = OllamaBackend(model="probe").timeout
          assert got == want, (
              f"installed cogno-synapse ignores COGNO_OLLAMA_TIMEOUT (timeout={got}, "
              f"expected {want}) — needs >= 0.1.2, or this job times out on a CPU runner")
          print(f"ollama timeout = {got}s")
          EOF
          pytest tests/integration -q -m "${{ matrix.select }}"
