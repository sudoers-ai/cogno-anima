name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 5 * * *"       # nightly — the Ollama suite below
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model for the integration suite"
        default: "qwen3:8b"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (pinned dev env + editable package)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # Sibling transport libs (not yet on PyPI) from git so the runtime deps
          # resolve: cogno-synapse -> cogno-homeo. Install homeo first (synapse needs it).
          pip install "cogno-homeo @ git+https://github.com/sudoers-ai/cogno-homeo.git"
          pip install "cogno-synapse @ git+https://github.com/sudoers-ai/cogno-synapse.git"
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: ruff check cogno_anima cognobench tests scripts

      - name: Type check (mypy)
        run: mypy

      - name: Unit tests (with coverage gate)
        # Integration tests need a live Ollama and are skipped in CI.
        run: pytest tests/unit -q --cov=cogno_anima --cov-report=term-missing --cov-fail-under=85

  # ── the 96 integration tests, which until now ran nowhere ──────────────────────────────
  #
  # They gate on a live Ollama and the `test` job has none, so they skipped silently in CI and
  # only ever ran when someone remembered to do it by hand. On 2026-08-03 that cost a real
  # defect: `context_used` was set to True on a FIRST turn because the model invented a
  # `context_turn` with no history to reference. The test that catches it
  # (`test_noumeno_context_used_consistency`) already existed, had been merged, and had never
  # executed anywhere automated.
  #
  # NOT a PR gate, on purpose. These assert on the behaviour of a real model, so a merge gate
  # here would make "main is always green" depend on sampling rather than on the code. Nightly
  # + manual gives the signal without turning a red main into noise — the same shape as
  # cogno-host's `ollama-e2e` canary.
  #
  # A CANARY, not the whole suite. The first version ran all 96 tests on
  # `mistral:latest` and was measured, not assumed: 56 passed, **30 failed on httpx.ReadTimeout**
  # and it took 2h03. A free runner is 2 CPU cores with no GPU, and a 7B model simply does not
  # answer inside the client timeout there. A nightly that is permanently red is worse than no
  # nightly — it teaches everyone to ignore it, which is precisely how the defects this job
  # exists to catch stayed hidden.
  #
  # The model matches what the deployment actually runs (`qwen3:8b`), so this exercises the real
  # configuration rather than a stand-in — worth more than a faster green. It is also BIGGER than
  # the mistral that timed out, so the canary is deliberately one file instead of ninety-six
  # tests; `model:` on a manual dispatch takes a smaller one if the runner cannot keep up.
  #
  # `COGNO_TEST_MODEL` is now real (the suite reads it, defaulting to mistral so local runs are
  # unchanged) — the first draft passed a model through an env var that nothing read, so every
  # test would have asked Ollama for something never pulled: green, and testing nothing.
  #
  # The two `llama3` sites are monkeypatched at the httpx layer and never reach Ollama, so
  # nothing pulls that 4.7 GB.
  ollama-integration:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ollama + pull the models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags && break || sleep 1; done
          ollama pull "${{ github.event.inputs.model || 'qwen3:8b' }}"
          ollama pull nomic-embed-text:latest
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Canary — the contract tests, against a real model
        env:
          COGNO_TEST_MODEL: "${{ github.event.inputs.model || 'qwen3:8b' }}"
          COGNO_NER_MODEL: "${{ github.event.inputs.model || 'qwen3:8b' }}"
        # test_noumeno carries the case that caught the `context_used` defect. Answer-quality
        # assertions live in cognobench, which is run deliberately and not on a CPU runner.
        run: pytest tests/integration/test_noumeno.py -q
